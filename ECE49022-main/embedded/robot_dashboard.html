<!--
  Browser telemetry dashboard for ATLAS.

  This page is relevant because it is the operator-facing view for the
  WebSocket telemetry broadcast by embedded/server.py, showing encoder speed,
  load-cell readings, and recent history during hardware tests.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Telemetry</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f5f5f4;
    --surface:   #ffffff;
    --surface2:  #f0efed;
    --border:    rgba(0,0,0,0.1);
    --text:      #1c1c1a;
    --muted:     #6b6b68;
    --teal:      #1D9E75;
    --blue:      #185FA5;
    --amber:     #BA7517;
    --red:       #A32D2D;
    --green:     #3B6D11;
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1c1c1a;
      --surface: #26261f;
      --surface2:#2e2e26;
      --border:  rgba(255,255,255,0.1);
      --text:    #f0efeb;
      --muted:   #888780;
    }
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem;
  }

  h1 { font-size: 18px; font-weight: 500; }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 8px;
  }

  .status-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 4px 10px;
    font-size: 13px;
    color: var(--muted);
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.live   { background: var(--teal); animation: pulse 2s infinite; }
  .dot.error  { background: var(--red); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  /* Connection form */
  .connect-bar {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .connect-bar input {
    flex: 1; min-width: 200px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 6px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }
  .connect-bar input:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(29,158,117,0.2); }
  .btn {
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 6px 14px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .btn:hover { background: var(--surface2); }
  .btn.primary { border-color: var(--teal); color: var(--teal); }
  .btn.primary:hover { background: rgba(29,158,117,0.08); }
  .btn.danger  { border-color: var(--red);  color: var(--red);  }
  .btn.danger:hover  { background: rgba(163,45,45,0.08); }

  /* Metric cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--surface2);
    border-radius: var(--radius-md);
    padding: 1rem;
  }
  .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .card-value { font-size: 30px; font-weight: 500; line-height: 1; }
  .card-unit  { font-size: 13px; color: var(--muted); margin-left: 3px; }
  .card-sub   { font-size: 12px; color: var(--muted); margin-top: 5px; }

  /* Gauges */
  .gauges {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .gauge-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
  }
  .gauge-name { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .gauge-track { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .gauge-fill  { height: 100%; border-radius: 4px; transition: width 0.35s ease; }
  .gauge-ends  { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

  /* Chart */
  .chart-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
  }
  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  .legend { display: flex; gap: 16px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .legend-swatch { width: 18px; height: 3px; border-radius: 2px; }
  .legend-swatch.dashed { background: repeating-linear-gradient(90deg, var(--blue) 0 4px, transparent 4px 7px); }

  /* Mini encoder row */
  .mini-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
  .mini-card { background: var(--surface2); border-radius: var(--radius-md); padding: 0.75rem 1rem; }
  .mini-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .mini-value { font-size: 20px; font-weight: 500; }

  /* log */
  .log {
    background: var(--surface2);
    border-radius: var(--radius-md);
    padding: 0.75rem 1rem;
    font-size: 12px;
    color: var(--muted);
    font-family: monospace;
    min-height: 40px;
    margin-bottom: 0;
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>Autonomous Tracking Load Assistance System</h1>
  <div class="status-row">
    <div class="badge"><span class="dot" id="dot"></span><span id="conn-label">Disconnected</span></div>
    <span style="font-size:12px;color:var(--muted);" id="ts"></span>
  </div>
</div>

<div class="connect-bar">
  <input id="ws-url" type="text" value="ws://raspberrypi.local:8765" placeholder="ws://<pi-ip>:8765" />
  <button class="btn primary" id="btn-connect" onclick="toggleConnect()">Connect</button>
</div>

<div class="cards">
  <div class="card">
    <div class="card-label">Speed — right</div>
    <div><span class="card-value" id="rpm-r">—</span><span class="card-unit">RPM</span></div>
    <div class="card-sub" id="ms-r">— m/s</div>
  </div>
  <div class="card">
    <div class="card-label">Speed — left</div>
    <div><span class="card-value" id="rpm-l">—</span><span class="card-unit">RPM</span></div>
    <div class="card-sub" id="ms-l">— m/s</div>
  </div>
  <div class="card">
    <div class="card-label">Payload weight</div>
    <div><span class="card-value" id="weight">—</span><span class="card-unit">g</span></div>
    <div class="card-sub" id="weight-kg">— kg</div>
  </div>
  <div class="card">
    <div class="card-label">Load cell raw</div>
    <div><span class="card-value" id="raw-adc" style="font-size:18px;">—</span></div>
    <div class="card-sub">ADC counts</div>
  </div>
</div>

<div class="gauges">
  <div class="gauge-card">
    <div class="gauge-name">Right motor</div>
    <div class="gauge-track"><div class="gauge-fill" id="g-r" style="width:0%;background:var(--teal);"></div></div>
    <div class="gauge-ends"><span>0</span><span>200 RPM</span></div>
  </div>
  <div class="gauge-card">
    <div class="gauge-name">Left motor</div>
    <div class="gauge-track"><div class="gauge-fill" id="g-l" style="width:0%;background:var(--blue);"></div></div>
    <div class="gauge-ends"><span>0</span><span>200 RPM</span></div>
  </div>
  <div class="gauge-card">
    <div class="gauge-name">Payload</div>
    <div class="gauge-track"><div class="gauge-fill" id="g-w" style="width:0%;background:var(--amber);"></div></div>
    <div class="gauge-ends"><span>0 g</span><span>2000 g</span></div>
  </div>
</div>

<div class="chart-card">
  <div class="chart-header">
    <span>Speed history (last 30 s)</span>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-swatch" style="background:var(--teal);"></div>
        <span>Right</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch dashed"></div>
        <span>Left</span>
      </div>
    </div>
  </div>
  <div style="position:relative;height:140px;">
    <canvas id="speedChart" role="img" aria-label="Motor RPM history over the past 30 seconds">Speed history.</canvas>
  </div>
</div>

<div class="log" id="log">Waiting for connection…</div>

<script>
const MAX_PTS = 30;
const rHistory = Array(MAX_PTS).fill(null);
const lHistory = Array(MAX_PTS).fill(null);

const WHEEL_DIAM_M = 0.065;   // metres — adjust to your wheels

let ws = null;
let chart = null;

function rpmToMs(rpm) {
  return (rpm / 60) * Math.PI * WHEEL_DIAM_M;
}

function pct(val, max) {
  return Math.min(100, Math.max(0, (val / max) * 100)).toFixed(1) + '%';
}

function logMsg(msg) {
  document.getElementById('log').textContent = msg;
}

function setStatus(state) {
  const dot   = document.getElementById('dot');
  const label = document.getElementById('conn-label');
  const btn   = document.getElementById('btn-connect');
  dot.className = 'dot ' + (state === 'live' ? 'live' : state === 'error' ? 'error' : '');
  label.textContent = state === 'live' ? 'Live' : state === 'error' ? 'Error' : 'Disconnected';
  btn.textContent   = ws && ws.readyState === WebSocket.OPEN ? 'Disconnect' : 'Connect';
}

function updateDisplay(d) {
  const rRpm = d.rpm_right ?? 0;
  const lRpm = d.rpm_left  ?? 0;
  const wg   = d.weight_g  ?? 0;

  document.getElementById('rpm-r').textContent   = Math.round(rRpm);
  document.getElementById('rpm-l').textContent   = Math.round(lRpm);
  document.getElementById('ms-r').textContent    = rpmToMs(rRpm).toFixed(2) + ' m/s';
  document.getElementById('ms-l').textContent    = rpmToMs(lRpm).toFixed(2) + ' m/s';
  document.getElementById('weight').textContent  = Math.round(wg);
  document.getElementById('weight-kg').textContent = (wg / 1000).toFixed(3) + ' kg';
  document.getElementById('raw-adc').textContent = (d.raw_adc ?? 0).toLocaleString();
  document.getElementById('ts').textContent      = d.ts ? new Date(d.ts * 1000).toLocaleTimeString() : '';

  document.getElementById('g-r').style.width = pct(rRpm, 200);
  document.getElementById('g-l').style.width = pct(lRpm, 200);
  document.getElementById('g-w').style.width = pct(wg, 2000);

  rHistory.push(rRpm); rHistory.shift();
  lHistory.push(lRpm); lHistory.shift();

  if (chart) {
    chart.data.datasets[0].data = [...rHistory];
    chart.data.datasets[1].data = [...lHistory];
    chart.update('none');
  }
}

function toggleConnect() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.close();
    return;
  }
  const url = document.getElementById('ws-url').value.trim();
  if (!url) return;
  logMsg('Connecting to ' + url + '…');
  try {
    ws = new WebSocket(url);
  } catch (e) {
    logMsg('Invalid URL: ' + e.message);
    setStatus('error');
    return;
  }

  ws.onopen = () => {
    setStatus('live');
    logMsg('Connected to ' + url);
  };

  ws.onmessage = (ev) => {
    try {
      const d = JSON.parse(ev.data);
      updateDisplay(d);
    } catch (e) {
      logMsg('Parse error: ' + e.message);
    }
  };

  ws.onerror = () => {
    setStatus('error');
    logMsg('WebSocket error — check that embedded/server.py is running on the Pi and the URL is correct.');
  };

  ws.onclose = () => {
    setStatus('');
    document.getElementById('btn-connect').textContent = 'Connect';
    logMsg('Disconnected.');
  };
}

// Build chart after page loads
window.addEventListener('load', () => {
  chart = new Chart(document.getElementById('speedChart'), {
    type: 'line',
    data: {
      labels: Array.from({length: MAX_PTS}, (_,i) => MAX_PTS - i + 's').reverse(),
      datasets: [
        {
          label: 'Right RPM',
          data: [...rHistory],
          borderColor: '#1D9E75',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.3,
          spanGaps: true,
          borderDash: [],
        },
        {
          label: 'Left RPM',
          data: [...lHistory],
          borderColor: '#185FA5',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.3,
          spanGaps: true,
          borderDash: [4, 3],
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: {
          min: 0, max: 220,
          ticks: { font: { size: 11 }, color: '#888', maxTicksLimit: 5 },
          grid: { color: 'rgba(128,128,128,0.12)' },
          border: { display: false },
        }
      }
    }
  });
});
</script>
</body>
</html>
